name: CI

# Release-artifact gate (findings M10/M11). Verifies formatting, lint, build,
# test typechecking, and the packed tarball from a clean checkout on the
# supported development Node versions (see NODE_SUPPORT.md). It deliberately has
# NO publish/deploy/release step: publication stays a manual, gated action.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Development/build contract: >=18 (NODE_SUPPORT.md), .nvmrc baseline 22.
        node: ['18.x', '22.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Verify (format, lint, build, test typecheck, jest)
        run: pnpm run verify

      - name: Pack and consumer smoke test
        run: pnpm run pack:smoke
